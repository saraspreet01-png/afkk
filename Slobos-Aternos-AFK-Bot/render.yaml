
services:
  - type: worker
    name: minecraft-server-test-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MC_HOST
        sync: false
      - key: MC_PORT
        value: "25565"
      - key: MC_USERNAME
        value: ServerTestBot
      - key: MC_VERSION
        value: ""
